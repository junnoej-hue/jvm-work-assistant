[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jvm-work-assistant"
version = "0.2.0"
description = "Local, per-user read-only Zimbra/Webex tools for JvM work"
requires-python = ">=3.11"
dependencies = ["mcp==1.30.0"]

[project.scripts]
jvm-assistant = "jvm_assistant.cli:main"
jvm-assistant-mcp = "jvm_assistant.server:main"

[tool.setuptools.packages.find]
where = ["src"]
